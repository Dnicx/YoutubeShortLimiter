<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Phone body -->
  <rect x="32" y="16" width="64" height="96" rx="8" ry="8" fill="url(#grad1)" />
  <!-- Phone screen -->
  <rect x="36" y="24" width="56" height="72" rx="4" ry="4" fill="#fff" />
  <!-- YouTube play button -->
  <polygon points="52,44 52,76 80,60" fill="#ff0000" />
  <!-- Pause/limit indicator -->
  <rect x="50" y="82" width="8" height="12" rx="2" fill="#667eea" />
  <rect x="62" y="82" width="8" height="12" rx="2" fill="#667eea" />
</svg>
