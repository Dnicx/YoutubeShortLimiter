<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Shorts Limiter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📱 YouTube Shorts Limiter</h1>
      <p class="subtitle">Take control of your doom scrolling</p>
    </header>

    <section class="stats">
      <h2>Current Session</h2>
      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-label">Shorts Watched</span>
          <span class="stat-value" id="shorts-count">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Time Spent</span>
          <span class="stat-value" id="time-spent">0:00</span>
        </div>
      </div>
      <div id="cooldown-status" class="cooldown-status hidden">
        <span class="cooldown-icon">⏸️</span>
        <span id="cooldown-text">Cool-down in progress</span>
      </div>
    </section>

    <section class="settings">
      <h2>Settings</h2>
      
      <div class="setting-group">
        <div class="setting-header">
          <input type="checkbox" id="time-limit-enabled" checked>
          <label for="time-limit-enabled">Time Limit</label>
        </div>
        <div class="setting-control">
          <label for="time-limit">Minutes per session:</label>
          <input type="number" id="time-limit" min="1" max="120" value="30">
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-header">
          <input type="checkbox" id="count-limit-enabled" checked>
          <label for="count-limit-enabled">Count Limit</label>
        </div>
        <div class="setting-control">
          <label for="count-limit">Shorts per session:</label>
          <input type="number" id="count-limit" min="1" max="200" value="50">
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-header">
          <label for="cooldown-minutes">Cool-down Period</label>
        </div>
        <div class="setting-control">
          <label for="cooldown-minutes">Minutes:</label>
          <input type="number" id="cooldown-minutes" min="1" max="60" value="5">
        </div>
      </div>

      <button id="save-btn" class="btn primary">Save Settings</button>
    </section>

    <section class="actions">
      <button id="reset-btn" class="btn secondary">Reset Session</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
